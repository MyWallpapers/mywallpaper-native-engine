[package]
name = "mywallpaper-native-engine"
version = "0.2.1"
edition = "2021"
publish = false

[[bin]]
name = "companion"
path = "src/main.rs"

[lib]
name = "mw_native_runtime"
path = "src/runtime.rs"
crate-type = ["cdylib"]
test = false

[workspace]
members = ["."]
resolver = "2"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
